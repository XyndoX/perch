<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>perch — live session</title>
<style>
:root{
  --bg:#0a0c0f; --surface:#11151a; --surface2:#161b22; --line:#1e242d;
  --fg:#dfe5ec; --dim:#7b8694; --dimmer:#525b68; --accent:#7dd3c0;
  --danger:#f2789a;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100dvh;
}

/* ---------- header ---------- */
header{
  display:flex;align-items:center;gap:14px;padding:10px 18px;
  background:linear-gradient(180deg,#0d1116,#0a0c0f);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;letter-spacing:.04em;color:var(--fg)}
.brand b{font-weight:600}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(125,211,192,.5);animation:pulse 2.4s ease-out infinite}
.pulse.off{background:var(--dimmer);animation:none;box-shadow:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(125,211,192,.45)}70%{box-shadow:0 0 0 7px rgba(125,211,192,0)}100%{box-shadow:0 0 0 0 rgba(125,211,192,0)}}
.stat{font-family:var(--mono);font-size:11px;color:var(--dimmer);letter-spacing:.03em}
.spacer{flex:1}
.presence{display:flex;align-items:center;gap:0}
.presence .av{
  width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font-size:10px;font-weight:600;font-family:var(--mono);letter-spacing:.02em;
  border:1.5px solid var(--bg);margin-left:-6px;color:#0a0c0f;
}
.presence .av:first-child{margin-left:0}
.presence-label{font-family:var(--mono);font-size:11px;color:var(--dimmer);margin-left:10px}

/* ---------- feed ---------- */
main{overflow-y:auto;overflow-x:hidden;padding:22px 18px 8px;scrollbar-color:#242c36 transparent}
.feed{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:2px}
.row{animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* agent prose — the primary reading surface */
.agent{padding:10px 0 12px;max-width:68ch}
.agent .who{
  font-family:var(--mono);font-size:11px;color:var(--dimmer);
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px;
}
.agent .body{white-space:pre-wrap;word-break:break-word;color:var(--fg);line-height:1.62}
.agent.thought .body{color:var(--dim);font-style:italic;line-height:1.55}
.agent .body .caret{
  display:inline-block;width:7px;height:1em;vertical-align:-2px;margin-left:2px;
  background:var(--accent);opacity:.8;animation:blink 1s steps(2) infinite;
}
@keyframes blink{50%{opacity:0}}

/* human prompts */
.msg{display:flex;flex-direction:column;gap:4px;margin:12px 0;max-width:min(58ch,80%)}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg .who{display:flex;align-items:center;gap:6px;font-size:11px;font-family:var(--mono);letter-spacing:.03em}
.msg .badge{
  width:17px;height:17px;border-radius:50%;display:grid;place-items:center;
  font-size:9px;font-weight:700;color:#0a0c0f;
}
.msg .bubble{
  background:var(--surface2);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;white-space:pre-wrap;word-break:break-word;
  border-left:2px solid var(--tint,var(--dimmer));
}
.msg.mine .bubble{border-left:1px solid var(--line);border-right:2px solid var(--tint,var(--dimmer))}

/* tool rows — quiet */
.tool{
  display:flex;align-items:center;gap:9px;padding:5px 10px;margin:1px 0;
  background:var(--surface);border:1px solid var(--line);border-radius:7px;
  font-family:var(--mono);font-size:12px;color:var(--dim);max-width:68ch;
}
.tool .ic{width:14px;text-align:center;color:var(--dimmer);flex:none}
.tool .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .st{
  flex:none;font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  padding:1px 6px;border-radius:20px;border:1px solid var(--line);color:var(--dimmer);
}
.tool[data-status="in_progress"],.tool[data-status="pending"]{color:var(--fg)}
.tool[data-status="in_progress"] .st,.tool[data-status="pending"] .st{color:var(--accent);border-color:rgba(125,211,192,.28)}
.tool[data-status="completed"] .ic{color:var(--accent)}
.tool[data-status="failed"]{border-color:rgba(242,120,154,.3)}
.tool[data-status="failed"] .st,.tool[data-status="failed"] .ic{color:var(--danger);border-color:rgba(242,120,154,.35)}

/* system / presence lines */
.sys{
  display:flex;align-items:center;gap:8px;justify-content:center;
  font-family:var(--mono);font-size:11px;color:var(--dimmer);
  padding:8px 0;letter-spacing:.02em;
}
.sys::before,.sys::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--line),transparent)}

/* raw fallback */
details.raw{margin:2px 0;max-width:68ch}
details.raw>summary{
  list-style:none;cursor:pointer;font-family:var(--mono);font-size:11px;
  color:var(--dimmer);padding:3px 8px;border-radius:6px;
}
details.raw>summary::-webkit-details-marker{display:none}
details.raw>summary:hover{color:var(--dim);background:var(--surface)}
details.raw>summary::before{content:"▸ ";}
details.raw[open]>summary::before{content:"▾ ";}
details.raw pre{
  margin:4px 0 8px;padding:9px 11px;background:var(--surface);border:1px solid var(--line);
  border-radius:7px;font-family:var(--mono);font-size:11.5px;color:var(--dim);
  overflow-x:auto;white-space:pre;line-height:1.5;
}

/* ---------- jump pill ---------- */
#jump{
  position:fixed;left:50%;bottom:82px;transform:translateX(-50%);
  background:var(--surface2);border:1px solid #2a333e;color:var(--fg);
  font-family:var(--mono);font-size:12px;padding:6px 14px;border-radius:20px;
  cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:5;
}
#jump[hidden]{display:none}
#jump:hover{border-color:var(--accent)}

/* ---------- composer ---------- */
footer{border-top:1px solid var(--line);background:#0d1116;padding:12px 18px 14px}
form{max-width:820px;margin:0 auto;display:flex;gap:9px;align-items:center}
input[type=text]{
  flex:1;background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:10px 13px;color:var(--fg);font-family:var(--sans);font-size:14px;outline:none;
}
input[type=text]::placeholder{color:var(--dimmer)}
input[type=text]:focus{border-color:#2f5b55;box-shadow:0 0 0 3px rgba(125,211,192,.07)}
button{
  background:var(--surface2);border:1px solid var(--line);color:var(--fg);
  border-radius:9px;padding:10px 16px;font-family:var(--sans);font-size:14px;cursor:pointer;
}
button:hover:not(:disabled){border-color:#2f5b55;color:var(--accent)}
button:disabled{opacity:.45;cursor:default}

/* ---------- name gate ---------- */
#gate{
  position:fixed;inset:0;background:rgba(6,8,10,.86);backdrop-filter:blur(6px);
  display:grid;place-items:center;z-index:20;
}
#gate[hidden]{display:none}
#gate .card{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:26px 26px 22px;width:min(360px,90vw);
}
#gate h1{margin:0 0 4px;font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.03em}
#gate p{margin:0 0 16px;font-size:13px;color:var(--dim);line-height:1.5}
#gate form{flex-direction:column;align-items:stretch;gap:10px}

/* ---------- toasts ---------- */
#toasts{position:fixed;bottom:88px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:30}
.toast{
  background:var(--surface2);border:1px solid rgba(242,120,154,.35);border-left:3px solid var(--danger);
  border-radius:8px;padding:9px 13px;font-size:13px;color:var(--fg);max-width:320px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);animation:in .2s ease-out;
}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="pulse" id="pulse"></span><b>perch</b></div>
  <div class="stat" id="agentName"></div>
  <div class="stat" id="stat">connecting…</div>
  <div class="spacer"></div>
  <div class="presence" id="presence"></div>
  <div class="presence-label" id="presenceLabel"></div>
</header>

<main id="scroll"><div class="feed" id="feed"></div></main>
<div id="jump" hidden>↓ jump to latest</div>

<footer>
  <form id="composer">
    <input type="text" id="input" placeholder="Steer the agent…" autocomplete="off" disabled>
    <button type="submit" id="send" disabled>Send</button>
  </form>
</footer>

<div id="gate" hidden>
  <div class="card">
    <h1>join the session</h1>
    <p>Your name is shown next to anything you send to the agent.</p>
    <form id="gateForm">
      <input type="text" id="gateName" placeholder="Your name" autocomplete="off" maxlength="24">
      <button type="submit">Watch live</button>
    </form>
  </div>
</div>

<div id="toasts"></div>

<script>
(function () {
'use strict';

var $ = function (id) { return document.getElementById(id); };
var feed = $('feed'), scroll = $('scroll'), jump = $('jump');
var DEMO = /(^|[?&])demo\b/.test(location.search);

/* ---------- identity colors ---------- */
var OWNER_COLOR = '#f0a868';
var PALETTE = ['#7dd3c0','#9d8df1','#6fb3f2','#f2789a','#b4d455','#f2c14e','#6ecbd8'];
function colorFor(id) {
  var s = String(id || '?');
  if (s === 'owner') return OWNER_COLOR;
  var m = /^v-(\d+)$/.exec(s);          // viewer ids are sequential — no hash collisions
  if (m) return PALETTE[(+m[1] - 1) % PALETTE.length];
  var h = 0;
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
function initials(name) {
  var p = String(name || '?').trim().split(/[\s_-]+/).filter(Boolean);
  if (!p.length) return '?';
  return (p.length > 1 ? p[0][0] + p[1][0] : p[0].slice(0, 2)).toUpperCase();
}

/* ---------- state ---------- */
var state = { me: null, count: 0, group: null, tools: Object.create(null), pinned: true, agentName: '' };

/* ---------- scrolling ---------- */
var scrollQueued = false;
function pin() {
  if (!state.pinned || scrollQueued) return;
  scrollQueued = true;
  requestAnimationFrame(function () { scrollQueued = false; scroll.scrollTop = scroll.scrollHeight; });
}
scroll.addEventListener('scroll', function () {
  var atEnd = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 80;
  state.pinned = atEnd;
  if (atEnd) jump.hidden = true;
});
jump.addEventListener('click', function () {
  state.pinned = true; jump.hidden = true; scroll.scrollTop = scroll.scrollHeight;
});
function appended() {
  state.count++;
  setStat();
  if (state.pinned) pin(); else jump.hidden = false;
}
function setStat() {
  var tok = state.tokens ? ' · ' + (state.tokens >= 1000 ? (state.tokens / 1000).toFixed(1) + 'k' : state.tokens) + ' ctx' : '';
  $('stat').textContent = state.count + ' events' + tok;
}

/* ---------- small DOM helper ---------- */
function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

/* ---------- renderers ---------- */
function textOf(content) {
  if (!content) return '';
  if (Array.isArray(content)) return content.map(textOf).join('');
  if (typeof content === 'string') return content;
  if (content.type === 'text' && typeof content.text === 'string') return content.text;
  return '';
}

function appendChunk(ev, update, variant) {
  var actorId = (ev.actor && ev.actor.id) || 'agent';
  var key = actorId + ':' + variant;
  if (ev.actor && ev.actor.name && !state.agentName) {
    state.agentName = ev.actor.name;
    $('agentName').textContent = ev.actor.name;
  }
  if (!state.group || state.group.key !== key) {
    var box = el('div', 'row agent' + (variant === 'thought' ? ' thought' : ''));
    // agent prose is the default voice — only thoughts get a label
    if (variant === 'thought') box.appendChild(el('div', 'who', 'thinking'));
    var body = el('div', 'body');
    box.appendChild(body);
    feed.appendChild(box);
    state.group = { key: key, body: body };
  }
  state.group.body.appendChild(document.createTextNode(textOf(update.content)));
}

var KIND_ICON = { read:'▤', edit:'✎', delete:'✕', move:'⇄', search:'⌕', execute:'❯', think:'✻', fetch:'⇣', other:'●' };
var STATUS_ICON = { pending:'○', in_progress:'◌', completed:'✓', failed:'✕' };

function renderTool(ev, u) {
  state.group = null;
  var id = u.toolCallId || ('anon-' + state.count);
  var row = state.tools[id];
  if (!row) {
    row = el('div', 'row tool');
    row.appendChild(el('span', 'ic'));
    row.appendChild(el('span', 'title'));
    row.appendChild(el('span', 'st'));
    state.tools[id] = row;
    feed.appendChild(row);
    row._kind = u.kind || 'other';
  }
  if (u.kind) row._kind = u.kind;
  var status = u.status || row.dataset.status || 'pending';
  row.dataset.status = status;
  if (u.title || !row.children[1].textContent) {
    row.children[1].textContent = u.title || u.rawInput && JSON.stringify(u.rawInput) || id;
  }
  row.children[0].textContent = KIND_ICON[row._kind] || KIND_ICON.other;
  row.children[2].textContent = (STATUS_ICON[status] || '') + ' ' + String(status).replace(/_/g, ' ');
  return row;
}

function renderPrompt(ev, frame) {
  state.group = null;
  var a = ev.actor || {}, tint = colorFor(a.id);
  var mine = state.me && a.id === state.me;
  var box = el('div', 'row msg' + (mine ? ' mine' : ''));
  box.style.setProperty('--tint', tint);
  var who = el('div', 'who');
  var badge = el('span', 'badge', initials(a.name || a.id));
  badge.style.background = tint;
  who.appendChild(badge);
  var nm = el('span', null, (a.name || a.id) + (mine ? ' (you)' : ''));
  nm.style.color = tint;
  who.appendChild(nm);
  box.appendChild(who);
  var txt = textOf(frame.params && frame.params.prompt);
  box.appendChild(el('div', 'bubble', txt || '(empty prompt)'));
  feed.appendChild(box);
}

function renderPresence(ev) {
  state.group = null;
  var p = ev.presence || {}, a = ev.actor || {};
  feed.appendChild(el('div', 'row sys',
    (a.name || a.id || 'someone') + (p.event === 'leave' ? ' left' : ' joined')));
  drawPresence(p.viewers || []);
}

function drawPresence(viewers) {
  var strip = $('presence');
  strip.textContent = '';
  viewers.slice(0, 8).forEach(function (v) {
    var av = el('div', 'av', initials(v.name || v.id));
    av.style.background = colorFor(v.id);
    av.title = v.name || v.id;
    strip.appendChild(av);
  });
  $('presenceLabel').textContent = viewers.length ? viewers.length + ' watching' : '';
}

function renderRaw(ev) {
  state.group = null;
  var d = el('details', 'row raw');
  var dir = ev.dir === 'client->agent' ? '→' : '←';
  var label = (ev.frame && (ev.frame.method || (ev.frame.result !== undefined ? 'result' : ev.frame.error ? 'error' : 'frame'))) || ev.kind;
  d.appendChild(el('summary', null, dir + ' ' + label + '  ·  seq ' + (ev.seq != null ? ev.seq : '?')));
  d.appendChild(el('pre', null, JSON.stringify(ev.frame != null ? ev.frame : ev, null, 2)));
  feed.appendChild(d);
}

function render(ev) {
  try {
    if (!ev || typeof ev !== 'object') return;
    if (ev.kind === 'presence') { renderPresence(ev); appended(); return; }
    var f = ev.frame || {};
    if (f.method === 'session/update') {
      var u = (f.params && f.params.update) || {};
      if (u.sessionUpdate === 'agent_message_chunk') { appendChunk(ev, u, 'msg'); appended(); return; }
      if (u.sessionUpdate === 'agent_thought_chunk') { appendChunk(ev, u, 'thought'); appended(); return; }
      if (u.sessionUpdate === 'tool_call' || u.sessionUpdate === 'tool_call_update') { renderTool(ev, u); appended(); return; }
      /* session metadata, not transcript — real agents emit usage_update many times per turn */
      if (u.sessionUpdate === 'usage_update') { state.tokens = u.used || (u.usage && u.usage.totalTokens) || u.totalTokens || state.tokens; setStat(); return; }
      if (u.sessionUpdate === 'available_commands_update' || u.sessionUpdate === 'session_info_update' || u.sessionUpdate === 'current_mode_update') { return; }
    }
    if (f.method === 'session/prompt' && ev.actor && ev.actor.type === 'human') { renderPrompt(ev, f); appended(); return; }
    renderRaw(ev); appended();
  } catch (e) {
    console.warn('render failed', e);
  }
}

/* ---------- toasts ---------- */
function toast(msg) {
  var t = el('div', 'toast', msg);
  $('toasts').appendChild(t);
  setTimeout(function () { t.remove(); }, 4200);
}

/* ---------- composer ---------- */
var T = encodeURIComponent(new URLSearchParams(location.search).get('t') || '');
$('composer').addEventListener('submit', function (e) {
  e.preventDefault();
  var input = $('input'), text = input.value.trim();
  if (!text) return;
  input.value = '';
  if (DEMO) { toast('demo mode — nothing is sent'); return; }
  fetch('/inject?t=' + T, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ id: state.me, text: text })
  }).then(function (r) {
    if (r.status === 409) toast('The agent has no session yet — try again in a moment.');
    else if (!r.ok) toast('Could not send (HTTP ' + r.status + ').');
  }).catch(function () { toast('Network error — is perch still running?'); });
});

/* ---------- live mode ---------- */
function connect(id) {
  state.me = id;
  $('input').disabled = false; $('send').disabled = false;
  var es = new EventSource('/events?id=' + encodeURIComponent(id) + '&t=' + T);
  es.onmessage = function (m) {
    var ev; try { ev = JSON.parse(m.data); } catch (_) { return; }
    render(ev);
  };
  es.onopen = function () { $('pulse').classList.remove('off'); };
  es.onerror = function () { $('pulse').classList.add('off'); $('stat').textContent = 'reconnecting…'; };
}

function join(name) {
  localStorage.setItem('perch.name', name);
  fetch('/join?t=' + T, {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ name: name })
  }).then(function (r) { return r.json(); })
    .then(function (j) { connect(j.id); })
    .catch(function () { $('pulse').classList.add('off'); $('stat').textContent = 'offline'; toast('Could not join the session.'); });
}

$('gateForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var n = $('gateName').value.trim();
  if (!n) return;
  $('gate').hidden = true;
  join(n);
});

/* ---------- demo fixture ---------- */
function demo() {
  state.me = 'v-1';
  $('input').disabled = false; $('send').disabled = false;
  $('stat').textContent = 'demo';
  var S = 'sess_9f2a';
  var owner = { id: 'owner', type: 'human', name: 'Chris' };
  var agent = { id: 'agent', type: 'agent', name: 'claude-code' };
  var max = { id: 'v-1', type: 'human', name: 'Max' };
  var dana = { id: 'v-2', type: 'human', name: 'Dana Ruiz' };
  var V1 = [{ id: 'v-1', name: 'Max' }];
  var V2 = [{ id: 'v-1', name: 'Max' }, { id: 'v-2', name: 'Dana Ruiz' }];
  var seq = 0;
  function frame(actor, dir, f) { return { seq: ++seq, ts: 0, kind: 'frame', actor: actor, dir: dir, frame: f }; }
  function chunk(t, which) {
    return frame(agent, 'agent->client', { jsonrpc: '2.0', method: 'session/update',
      params: { sessionId: S, update: { sessionUpdate: which || 'agent_message_chunk', content: { type: 'text', text: t } } } });
  }
  function tool(o) {
    return frame(agent, 'agent->client', { jsonrpc: '2.0', method: 'session/update',
      params: { sessionId: S, update: Object.assign({ sessionUpdate: o.toolCallId && o.status && !o.title ? 'tool_call_update' : 'tool_call' }, o) } });
  }
  function prompt(actor, text) {
    return frame(actor, 'client->agent', { jsonrpc: '2.0', id: seq + 1, method: 'session/prompt',
      params: { sessionId: S, prompt: [{ type: 'text', text: text }] } });
  }
  function presence(actor, event, viewers) {
    return { seq: ++seq, ts: 0, kind: 'presence', actor: actor, presence: { event: event, viewers: viewers } };
  }

  var fixture = [
    prompt(owner, 'The checkout webhook is dropping events under load. Find the bottleneck and fix it.'),
    chunk('Let me look at how the webhook handler is wired up first.', 'agent_thought_chunk'),
    tool({ toolCallId: 't1', title: 'Read src/webhooks/checkout.ts', kind: 'read', status: 'in_progress' }),
    tool({ toolCallId: 't1', status: 'completed' }),
    tool({ toolCallId: 't2', title: 'Search "await db." in src/webhooks', kind: 'search', status: 'in_progress' }),
    tool({ toolCallId: 't2', status: 'completed' }),
    chunk('Found it. '),
    chunk('`handleCheckout` awaits three sequential database round-trips before acknowledging '),
    chunk('the webhook, so Stripe times out at 10s once concurrency climbs past ~40 req/s.\n\n'),
    chunk('The fix is to acknowledge first and process on a queue.'),
    tool({ toolCallId: 't3', title: 'Edit src/webhooks/checkout.ts', kind: 'edit', status: 'in_progress' }),
    tool({ toolCallId: 't3', status: 'completed' }),
    tool({ toolCallId: 't4', title: 'npm test -- webhooks', kind: 'execute', status: 'in_progress' }),
    presence(max, 'join', V1),
    tool({ toolCallId: 't4', status: 'failed' }),
    chunk('Two tests fail — they assert the handler returns the persisted order id.'),
    prompt(max, 'don\'t queue it — we already have the outbox table, write there and let the worker drain it'),
    chunk('Good call, the outbox is already transactional. ', 'agent_thought_chunk'),
    chunk('Switching to the outbox table instead of a new queue. '),
    chunk('That keeps the write in the same transaction as the order, so no lost events on crash.'),
    tool({ toolCallId: 't5', title: 'Edit src/webhooks/checkout.ts', kind: 'edit', status: 'in_progress' }),
    tool({ toolCallId: 't5', status: 'completed' }),
    presence(dana, 'join', V2),
    tool({ toolCallId: 't6', title: 'npm test -- webhooks', kind: 'execute', status: 'in_progress' }),
    prompt(dana, 'also drop the retry loop in drainOutbox, the worker already retries'),
    tool({ toolCallId: 't6', status: 'completed' }),
    frame(agent, 'agent->client', { jsonrpc: '2.0', id: 1, result: { stopReason: 'end_turn' } }),
    chunk('All 24 webhook tests pass. p99 on the handler is now 8ms — it writes the order and an '),
    chunk('outbox row in one transaction, then returns 200 immediately.'),
    presence(dana, 'leave', V1)
  ];

  var i = 0;
  (function step() {
    if (i >= fixture.length) return;
    var ev = fixture[i++];
    render(ev);
    var isChunk = ev.frame && ev.frame.params && ev.frame.params.update
      && /chunk$/.test(ev.frame.params.update.sessionUpdate || '');
    setTimeout(step, isChunk ? 110 : 420);
  })();
}

/* ---------- boot ---------- */
if (DEMO) {
  demo();
} else {
  var saved = localStorage.getItem('perch.name');
  if (saved) join(saved);
  else { $('gate').hidden = false; $('gateName').focus(); }
}
})();
</script>
